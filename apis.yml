aid: boulder-care
name: Boulder Care
description: 'Boulder Care is a Portland, Oregon telehealth provider founded in 2017
  by Stephanie Strong that delivers evidence-based outpatient treatment for opioid
  and alcohol use disorder entirely through a mobile app. Participants connect to a
  collaborative care team — addiction medicine clinicians, peer recovery specialists
  and care coordinators — over secure video and messaging, and are prescribed
  medications for addiction treatment including buprenorphine/naloxone (Suboxone),
  naltrexone (Revia, Vivitrol) and acamprosate (Campral). The company focuses on
  Medicaid beneficiaries and other historically underserved populations, contracts
  with health plans, health systems, employers and correctional and jail-based
  referral partners, and has served more than 12,000 participants across states
  including Oregon, Washington, Colorado, North Carolina, New Mexico, Ohio and
  Michigan. Boulder Care raised a $35M Series C in 2024 led by Advance Venture
  Partners. It ships software only as an end-user patient product: there is no
  developer portal, no published API documentation, no SDK and no machine-readable
  specification anywhere on its public surface.'
